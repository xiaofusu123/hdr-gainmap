[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdrgainmap"
version = "0.1.2b1"
description = "把 8bit SDR 插画转成 HDR 母版：Ultra HDR JPEG / 16bit PNG / 10bit & 12bit HEIC / 12bit AVIF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pillow-heif>=1.8",
]

[project.scripts]
hdrgainmap = "hdrgainmap.cli:main"

[project.urls]
Homepage = "https://github.com/xiaofusu123/hdr-gainmap"
Repository = "https://github.com/xiaofusu123/hdr-gainmap"

[tool.setuptools]
packages = ["hdrgainmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
